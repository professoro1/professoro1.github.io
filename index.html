<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Arcade</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="background-grid"></div>

<header class="hero">
    <h1>PIXEL ARCADE</h1>
    <p>Play browser games built with Godot.</p>

    <div class="hero-buttons">
        <a href="games.html" class="btn">Browse Games</a>
        <a href="https://github.com" class="btn secondary">Source</a>
    </div>
</header>

<section class="featured">
    <h2>Featured Games</h2>

    <div class="card-grid">
        <div class="game-card">
            <img src="assets/screenshots/game1.jpg" alt="">
            <h3>Space Runner</h3>
            <p>Fast-paced neon action.</p>
            <a href="games/2026-space-runner/">Play</a>
        </div>

        <div class="game-card">
            <img src="assets/screenshots/game2.jpg" alt="">
            <h3>Castle Defense</h3>
            <p>Protect your kingdom.</p>
            <a href="games/2025-castle-defense/">Play</a>
        </div>
    </div>
</section>

</body>
</html>
